[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "orca-simulator"
version = "0.1.0"
description = "Bassins simulés d'ORCA : modèle physique, capteurs et actionneurs exposés en Modbus TCP"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Lorenzo Baladier" },
  { name = "Marius Barbaud" },
]
dependencies = [
  # 3.12+ déprécie ModbusDeviceContext au profit de SimDevice (API v4 encore instable).
  "pymodbus>=3.11,<3.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[project.scripts]
orca-simulator = "orca_simulator.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/orca_simulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Textes en français : signe moins, espaces insécables et guillemets typographiques sont voulus.
ignore = ["RUF001", "RUF002", "RUF003"]
