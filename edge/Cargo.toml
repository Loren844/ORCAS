[package]
name = "orca-edge"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Contrôleur de bassin ORCA : acquisition Modbus et publication MQTT"
authors = ["Lorenzo Baladier", "Marius Barbaud"]
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
rumqttc = { version = "0.25.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "signal", "net"] }
tokio-modbus = { version = "0.17.0", default-features = false, features = ["tcp"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
strip = true
